<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubistgetgenug</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #calc_box {
            width: 350px;
            background-color: #121212;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 2px rgba(255, 145, 0, 0.2);
        }

        #display_screen {
            width: 100%;
            height: 120px;
            background-color: #1a1a1a;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 28px;
            font-weight: 700;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            margin-bottom: 25px;
            text-align: right;
            transition: all 0.3s ease;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            background-color: #222222;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #2a2a2a;
        }

        .operator {
            color: #ff9100;
            background-color: #1e150a;
        }

        .operator:hover {
            background-color: #2d1f0e;
        }

        #equals {
            grid-column: span 2;
            color: #121212;
            background-color: #ff9100;
            font-weight: 700;
        }

        #equals:hover {
            background-color: #ffa229;
            box-shadow: 0 0 15px rgba(255, 145, 0, 0.4);
        }

        @keyframes neon_pulse {
            0% { background-color: #1e150a; color: #ff9100; box-shadow: inset 0 0 20px rgba(255, 145, 0, 0.2); }
            50% { background-color: #ff9100; color: #121212; box-shadow: inset 0 0 0px rgba(255, 145, 0, 0); }
            100% { background-color: #1e150a; color: #ff9100; box-shadow: inset 0 0 20px rgba(255, 145, 0, 0.2); }
        }

        .change_bg {
            animation: neon_pulse 1.2s infinite ease-in-out;
            border-color: #ff9100 !important;
        }
    </style>
</head>
<body>
    <div id="calc_box">
        <input type="text" id="display_screen" readonly>

        <div class="buttons">
            <button onclick="clearDisplay()" class="operator">AC</button>
            <button onclick="deleteLast()" class="operator">DEL</button>
            <button onclick="appendGiven('%')" class="operator">%</button>
            <button onclick="appendGiven('/')" class="operator">/</button>

            <button onclick="appendGiven(7)">7</button>
            <button onclick="appendGiven(8)">8</button>
            <button onclick="appendGiven(9)">9</button>
            <button onclick="appendGiven('*')" class="operator">*</button>

            <button onclick="appendGiven(4)">4</button>
            <button onclick="appendGiven(5)">5</button>
            <button onclick="appendGiven(6)">6</button>
            <button onclick="appendGiven('-')" class="operator">-</button>

            <button onclick="appendGiven(1)">1</button>
            <button onclick="appendGiven(2)">2</button>
            <button onclick="appendGiven(3)">3</button>
            <button onclick="appendGiven('+')" class="operator">+</button>

            <button onclick="appendGiven(0)">0</button>
            <button onclick="appendGiven('.')">.</button>
            <button onclick="calculate()" id="equals">=</button>
        </div>
    </div>

    <audio src="dreiton.mp3" id="lifetime" preload="auto"></audio>

    <script>
        let finalCalculatedResult = "";

        function appendGiven(Given) {
            document.getElementById("display_screen").value += Given;
        }

        function clearDisplay() {
            document.getElementById("display_screen").value = "";
            finalCalculatedResult = "";
        }

        function deleteLast(){
            let current_display = document.getElementById("display_screen");
            current_display.value = current_display.value.slice(0, -1);
        }

        function calculate() {
            let display = document.getElementById("display_screen");
            let math_problem = display.value;

            // Prevent running if the screen is empty
            if (math_problem.trim() === "") return;

            try {
                let result = eval(math_problem);
                finalCalculatedResult = result; 
            } catch (error) {
                finalCalculatedResult = "Error";
            }
            playSongWithLyrics();
        }

        function playSongWithLyrics() {
            const song = document.getElementById("lifetime");
            const display = document.getElementById("display_screen");
            
            display.style.textAlign = "center";
            display.style.fontStyle = "italic";
            display.style.fontWeight = "700";
            display.classList.add("change_bg");

            const lyrics = [
                { text: "Smoke and ashes", time: 0 },
                { text: "from these letters", time: 2000 },
                { text: "I'm burning", time: 3500 },
                { text: "No fairy-tale ending", time: 5000 },
                { text: "if there was", time: 7000 },
                { text: "no beginning", time: 8500 },
                { text: "Is it even", time: 10500 },
                { text: "worth it", time: 12000 },
                { text: "to reminisce?", time: 13000 },
                { text: "How do you grieve", time: 14000 },
                { text: "for a love", time: 16000 },
                { text: "that did not even exist?", time: 17000 },
            ];

            song.currentTime = 0;
            song.play().catch(e => {
                console.log("Audio block error handled: ", e);
            });

            lyrics.forEach(line => {
                setTimeout(() => {
                    if(display.classList.contains("change_bg")) {
                        display.value = line.text;
                    }
                }, line.time);
            });

            song.onended = () => {
                display.value = finalCalculatedResult;
                display.style.textAlign = "right";
                display.style.fontStyle = "normal";
                display.classList.remove("change_bg");
            };
        }
    </script>
</body>
</html>
